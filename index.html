<!doctype html>
<html lang="hi-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lakshya · लक्ष्य: daily number puzzle</title>
<meta name="description" content="Roz ek nayi number paheli. Numbers jodo, target banao. रोज़ एक नई पहेली। Free, offline, no login.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1b1f3a">
<meta property="og:title" content="Lakshya · लक्ष्य"><meta property="og:description" content="Aaj ka target hit karo. Tum kitni chaal mein?"><meta property="og:image" content="icon-512.png">
<style>
:root{--bg:#1b1f3a;--card:#2a2f55;--acc:#ffb703;--ok:#2ec4b6;--tx:#f1f1f6;--mut:#a7a9c4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:16px}
h1{margin:4px 0;font-size:22px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub{color:var(--mut);font-size:13px}
.target{font-size:56px;font-weight:800;text-align:center;color:var(--acc);margin:12px 0 4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
button{font:inherit;border:0;border-radius:14px;cursor:pointer;color:var(--tx);touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ok)}
.n{background:var(--card);font-size:26px;font-weight:700;padding:18px 0;min-height:56px}
.n.sel{outline:3px solid var(--acc)}.n.gone{visibility:hidden}.n.hint{outline:3px dashed var(--ok)}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.op{background:#3c4380;font-size:26px;padding:12px 0;min-height:52px}.op.sel{background:var(--acc);color:#000}
.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1;padding:12px 4px;background:#444a7a;font-size:14px}
#msg{min-height:24px;text-align:center;margin-top:10px}
.alt{display:none;width:100%;margin-top:10px;padding:12px;background:#444a7a}
#share{background:var(--ok);color:#000;font-weight:700;padding:14px;width:100%;margin-top:12px;display:none}
#lang{background:#444a7a;font-size:12px;padding:6px 10px;border-radius:10px}
.stats{display:flex;justify-content:space-around;margin-top:16px;color:var(--mut);font-size:13px;text-align:center}
.stats b{display:block;font-size:20px;color:var(--tx)}
#hist{font-size:13px;color:var(--mut);margin-top:8px;text-align:center}
nav{margin-top:14px;text-align:center;font-size:12px}nav a{color:var(--mut);margin:0 8px}
#how{position:fixed;inset:0;background:rgba(10,12,30,.92);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#how div{background:var(--card);border-radius:18px;padding:20px;max-width:380px}#how p{margin:10px 0}#go{background:var(--acc);color:#000;font-weight:700;width:100%;padding:14px;margin-top:8px}
</style>
</head>
<body>
<main>
<h1><span>लक्ष्य Lakshya <span class="sub" id="day"></span></span><button id="lang" aria-label="Language">Hinglish</button></h1>
<div class="sub" id="sub"></div>
<div class="target" id="target">-</div>
<div class="sub" style="text-align:center"><span id="lSteps"></span>: <span id="steps">0</span></div>
<div class="grid" id="nums"></div>
<div class="ops" id="ops"></div>
<div class="row"><button id="undo"></button><button id="reset"></button><button id="hint"></button><button id="giveup"></button></div>
<div id="msg" aria-live="polite"></div>
<button id="share"></button>
<button id="more" class="alt"></button>
<button id="install" class="alt"></button>
<div class="stats"><div><b id="sPlayed">0</b><span id="lPlayed"></span></div><div><b id="sStreak">0</b><span id="lStreak"></span></div><div><b id="sBest">0</b><span id="lBest"></span></div><div><b id="sStars">0</b><span id="lStars"></span> <span id="badge"></span></div></div>
<div id="hist"></div>
<nav><a href="privacy.html">Privacy · गोपनीयता</a><a href="about.html">About</a></nav>
</main>
<div id="how"><div><div id="howText"></div><button id="go"></button></div></div>
<script src="config.js"></script>
<script src="game.js"></script>
</body>
</html>
